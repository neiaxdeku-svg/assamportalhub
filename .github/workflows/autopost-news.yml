name: Auto-Sync Latest Assam News

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Fetch and Autopost Latest News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/sync-news.mjs

      - name: Commit and Push Updated News
        run: |
          git config --global user.name "AssamPortalHub Bot"
          git config --global user.email "bot@assamportalhub.local"
          if [[ -n $(git status -s src/newsData.json) ]]; then
            git add src/newsData.json
            git commit -m "Auto-update latest Assam news articles [cron]"
            git push origin main
            echo "New articles successfully committed and pushed!"
          else
            echo "No new articles found. Working tree clean."
          fi
